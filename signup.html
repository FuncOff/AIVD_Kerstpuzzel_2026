<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Aanmelden</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topnav">
        <a href="leaderboard.html">Learderboard</a>
        <a href="questions.html">Oplossingsoverzicht</a>
        <a href="login.html">Inloggen</a>
        <a href="signup.html">Aanmelden</a>
    </div>

    <h1>Account Aanmaken</h1>

    <form id="signup-form">
        <label for="gebruikersnaam">Gebruikersnaam:</label><br>
        <input type="text" id="gebruikersnaam" required><br><br>

        <label for="wachtwoord">Wachtwoord:</label><br>
        <input type="password" id="wachtwoord" required><br><br>

        <button type="submit">Registreren</button>
    </form>

    <script>
        // event listener for the signup button
        document.getElementById("signup-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            let gebruikersnaam = document.getElementById("gebruikersnaam").value;
            let wachtwoord = document.getElementById("wachtwoord").value;

            // Information sent to js
            let response = await fetch("/api/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ gebruikersnaam, wachtwoord })
            });

            // await result from backend for error handling
            let result = await response.json();
            if (response.ok) {
                alert("Account aangemaakt! Je kunt nu inloggen.");
                window.location.href = "login.html";
            } else {
                alert(result.error || "Registreren mislukt");
            }
        });
    </script>
</body>
</html>
